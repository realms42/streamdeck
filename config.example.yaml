# ============================================================
# Stream Deck service — example config demonstrating every feature
# ============================================================

device:
  # Optional: target a specific deck by serial number.
  # If omitted or serial not found, falls back to index.
  # serial: "CL12345678"
  index: 0          # 0-based; use when you have only one deck
  brightness: 75    # 0–100

  # Optional default font for every button. May be a font file path relative
  # to this config, or a system font name Pillow can resolve. Per-button and
  # per-state `font:` keys override it. Omit to use the built-in default.
  # font: "DejaVuSans-Bold.ttf"

buttons:

  # ----------------------------------------------------------
  # 1. Command button (with a long-press alternative)
  #    Press key 0 to open a web browser; hold it to open a
  #    different page after `hold_seconds`.
  # ----------------------------------------------------------
  - key: 0
    label: "Browser"
    font_size: 13
    text_color: "white"
    background_color: "#1a73e8"   # Google-blue background
    # font: "DejaVuSans-Bold.ttf" # per-button font override
    # icon: icons/browser.png     # uncomment to show an image instead
    on_press:
      - type: command
        run: "xdg-open"           # use "start" on Windows
        args: ["https://example.com"]
    # on_hold fires once if the key stays down past `hold_seconds`.
    # When a hold fires, the matching on_release is skipped.
    hold_seconds: 0.8
    on_hold:
      - type: command
        run: "xdg-open"
        args: ["https://example.com/help"]

  # ----------------------------------------------------------
  # 2. Toggle button — mic mute
  #    Pressing key 1 flips the "muted" state between false/true.
  #    The button shows a different label/color for each state, and
  #    the visual updates reactively whenever "muted" changes.
  # ----------------------------------------------------------
  - key: 1
    # Default appearance (muted = false, or unset)
    label: "Mic ON"
    font_size: 12
    text_color: "white"
    background_color: "#2d7a2d"   # green when live
    # icon: icons/mic_on.png

    # State-driven appearance overrides.
    # "muted" is the state variable name; "true"/"false" are its possible values.
    states:
      muted:
        "false":
          label: "Mic ON"
          background_color: "#2d7a2d"
          # icon: icons/mic_on.png
        "true":
          label: "Muted"
          background_color: "#cc0000"   # red when muted
          # icon: icons/mic_off.png

    on_press:
      # Flip "muted" between false and true
      - type: toggle
        key: muted
        values: ["false", "true"]
      # Also run a shell command to actually mute/unmute
      # (You would use a smarter script that reads current state in practice.)
      # - type: command
      #   run: "amixer"
      #   args: ["set", "Capture", "toggle"]

  # ----------------------------------------------------------
  # 3. Icon button — open a folder
  #    Demonstrates using a standalone icon with no label.
  # ----------------------------------------------------------
  - key: 2
    icon: "icons/folder.png"      # 72×72 or larger PNG recommended
    label: ""                     # empty label — icon only
    background_color: "#222222"
    on_press:
      - type: command
        run: "xdg-open"
        args: ["/home/user/Documents"]

  # ----------------------------------------------------------
  # 4. Dim button — actually changes deck brightness
  #    `set_brightness` drives the hardware directly; the matching
  #    `set_state` updates the on-screen indicator reactively.
  # ----------------------------------------------------------
  - key: 3
    label: "Dim"
    font_size: 11
    text_color: "#ffcc00"
    background_color: "#221100"
    states:
      dimmed:
        "true":
          label: "Dimmed"
          background_color: "#332200"
    on_press:
      - type: set_brightness
        value: 30
      - type: set_state
        key: dimmed
        value: "true"

  # ----------------------------------------------------------
  # 5. Direct brightness button (multi-line label)
  #    One press sets deck brightness to 100 %, release dims it.
  #    The "\n" in the label is centered across both lines.
  # ----------------------------------------------------------
  - key: 4
    label: "MAX\nBright"
    font_size: 12
    text_color: "black"
    background_color: "#ffffff"
    on_press:
      - type: set_brightness
        value: 100
      - type: set_state
        key: dimmed
        value: "false"
    on_release:
      # Dim back down when finger lifts
      - type: set_brightness
        value: 60
