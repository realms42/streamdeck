[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "streamdeck-service"
version = "0.1.0"
description = "Drive an Elgato Stream Deck from a YAML config file with live reload"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamdeck>=0.9.5",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "watchdog>=4.0.0",
]

[project.scripts]
streamdeck-service = "streamdeck_service.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["streamdeck_service*"]
